[package]
name = "vfs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Minimal filesystem abstraction: std::fs on native, an in-memory tree on wasm"

[dependencies]
# Near dependency-free: the native backend forwards to std::fs and the wasm
# backend uses only std collections + a thread-local. `serde` is here solely so
# `Platform` crosses the JSON boundary with the rest of a scan result.
serde.workspace = true
