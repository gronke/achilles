[package]
name = "detect"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Detect Electron / Tauri frameworks and their runtime versions across macOS, Windows, and Linux apps"

[dependencies]
# Both layouts (macOS `.app` bundle and the portable import-table path) are
# always compiled; `vfs::platform()` picks between them at run time. It's a
# compile-time constant on the desktop, so the unused arm folds away — but on
# wasm the browser may be handed any of the three, so both must be present.
goblin.workspace = true
memchr.workspace = true
plist.workspace = true
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
vfs.workspace = true

# Binary string-scanning probes mmap the executable on native; on wasm they
# read it into an owned buffer through `vfs` instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2.workspace = true

# PE version resources are only ever read on a real Windows host or in the
# browser (which may be handed a Windows app), so macOS / Linux desktop builds
# skip `pelite`. wasm takes it without the `mmap` feature — that pulls in
# libc/winapi, neither of which exists there — and reads bytes via `vfs`.
[target.'cfg(target_os = "windows")'.dependencies]
pelite = { workspace = true, features = ["mmap"] }
winreg.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
pelite = { workspace = true, features = ["std"] }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "detect"
path = "examples/detect.rs"
