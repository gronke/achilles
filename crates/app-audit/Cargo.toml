[package]
name = "app-audit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Audit an installed app for signing, hardening, and ASAR integrity across macOS, Windows, and Linux."

[features]
# Shell out to `codesign` for signature + entitlements facts. Needs a real
# macOS host and process spawning, so it pulls in tokio and is off on wasm.
codesign = ["dep:tokio"]
default = ["codesign"]

[dependencies]
# All three backends are always compiled; `vfs::platform()` picks one at run
# time. It's a compile-time constant on the desktop so the unused arms fold
# away — but the browser may be handed an app from any platform. PE/ELF parsing
# (goblin, memchr) and the Authenticode signer (cms, x509-cert) are pure Rust
# and portable; only the two facts that need a host OS are gated below.
cms.workspace = true
goblin.workspace = true
memchr.workspace = true
plist.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
vfs.workspace = true
x509-cert.workspace = true
tokio = { workspace = true, optional = true }

# ELF hardening flags are read from an mmap on native (Electron binaries run to
# hundreds of MB); on wasm the upload is already in memory, read via `vfs`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2.workspace = true

# Authenticode *trust* verification consults the OS store (WinVerifyTrust), so
# it only exists on a real Windows host. Elsewhere `trusted` stays `None`.
[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[[example]]
name = "audit"
path = "examples/audit.rs"
